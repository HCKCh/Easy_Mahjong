<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b5e45" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>東西南北麻將托兒所 · Four Winds Mahjong Nursery</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .landing{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#24684f,#0b332a 52%,#071e19)}
    .landing-card{width:min(760px,100%);background:rgba(250,247,238,.97);color:#18342b;border-radius:28px;padding:42px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
    .landing-card h1{font-size:clamp(34px,7vw,64px);margin:8px 0}.landing-card p{opacity:.75;font-size:18px}
    .mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:32px}.mode{display:block;padding:28px 20px;border-radius:20px;text-decoration:none;background:#fff;color:#18342b;border:1px solid #d8ddd9;transition:.18s}.mode:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.12)}.mode strong{display:block;font-size:24px;margin:8px}.mode span{font-size:14px;opacity:.7}.stage{font-size:12px;letter-spacing:.15em;font-weight:800;color:#7b6840}
    /* 排行榜：最近 10 場 */
    .board{margin-top:30px;text-align:left}.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}.board-head h2{margin:0;font-size:22px}.board-head small{color:#7b6840;font-weight:800;letter-spacing:.08em}
    .board-empty{padding:18px;border-radius:16px;background:#fff;border:1px dashed #cfd7d2;color:#6d7d77;text-align:center;font-size:14px}
    .rank-table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #d8ddd9;font-size:14px}.rank-table th,.rank-table td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef1ef}.rank-table th{background:#eef3f0;color:#577068;font-size:12px}.rank-table tr:last-child td{border-bottom:0}.rank-table .num{text-align:right;font-variant-numeric:tabular-nums}.rank-no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e7eee9;font-weight:900;font-size:12px}.rank-1 .rank-no{background:#f0ca63;color:#3c2e08}.rank-2 .rank-no{background:#d9dde0}.rank-3 .rank-no{background:#e7c4a0}
    .pos{color:#1d7a4f;font-weight:900}.neg{color:#b3482e;font-weight:900}
    .match-list{display:grid;gap:10px;margin-top:16px}.match{background:#fff;border:1px solid #d8ddd9;border-radius:16px;padding:12px 14px}.match-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:#6d7d77;margin-bottom:8px}.match-meta b{color:#18342b}.tag{padding:2px 8px;border-radius:999px;background:#eef3f0;color:#2d5c49;font-weight:800}.tag.unfinished{background:#fbeee0;color:#9a5a1c}
    .match-players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.mp{padding:7px 8px;border-radius:12px;background:#f6f8f7;min-width:0}.mp.top{background:#fdf3d6;box-shadow:inset 0 0 0 1px #ebcf7a}.mp-name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mp-name.bot{color:#7d8b85;font-weight:600}.mp-pts{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}.mp-delta{font-size:12px;font-variant-numeric:tabular-nums}
    @media(max-width:620px){.match-players{grid-template-columns:repeat(2,minmax(0,1fr))}.rank-table .hide-sm{display:none}}
    @media(max-width:620px){.landing-card{padding:28px 18px}.mode-grid{grid-template-columns:1fr}}
    .lang-btn{position:absolute;top:18px;right:18px;border:0;border-radius:999px;padding:8px 14px;background:#e7eee9;color:#265143;font-weight:800;cursor:pointer}.landing-card{position:relative}
  </style>
</head>
<body>
  <main class="landing">
    <section class="landing-card">
      <button class="lang-btn" id="lang-btn" type="button"></button>
      <div class="stage">FOUR WINDS MAHJONG NURSERY</div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="tagline"></p>
      <div class="mode-grid">
        <a class="mode" href="./online.html"><div style="font-size:44px">🀄</div><strong data-i18n="play"></strong><span data-i18n="playSub"></span></a>
        <a class="mode" href="./rules.html"><div style="font-size:44px">📖</div><strong data-i18n="rules"></strong><span data-i18n="rulesSub"></span></a>
      </div>
      <section class="board" aria-labelledby="board-title">
        <div class="board-head"><h2 id="board-title" data-i18n="board"></h2><small data-i18n="recent"></small></div>
        <div id="board-body"><div class="board-empty" data-i18n="loading"></div></div>
      </section>
    </section>
  </main>
  <script>
  (()=>{
    // 與遊戲頁共用語言設定（localStorage tw-mj-lang）
    const T={
      title:['東西南北麻將托兒所','Four Winds Mahjong Nursery'],
      tagline:['開張啦！台灣 16 張麻將，找朋友或 AI 一起打','Now open! 16-tile Taiwanese mahjong with friends or AI'],
      play:['開始打牌','Play'],
      playSub:['自選 AI 人數 0～3 · 用房號邀朋友 · 空位 AI 補上','Choose 0–3 AI players · invite friends with a room code · AI fills empty seats'],
      board:['🏆 排行榜','🏆 Leaderboard'],
      recent:['最近 10 場','Last 10 matches'],
      loading:['載入中…','Loading…'],
      empty:['還沒有對戰紀錄，打完一局就會出現在這裡！','No matches yet. Finish a hand and it will show up here!'],
      failed:['排行榜暫時無法載入','The leaderboard could not be loaded'],
      player:['玩家','Player'],total:['累計輸贏','Net'],games:['場數','Matches'],firsts:['第一名','1st place'],
      solo:['人機','vs AI'],friend:['好友房','Friends'],hands:['{n} 局','{n} hands'],unfinished:['未打完','Unfinished'],
      toggle:['EN','中文'],
      rules:['麻將規則','How to play'],
      rulesSub:['從認牌到算台，一頁看懂台灣 16 張麻將','Tiles, calls, tai and payments: Taiwanese 16-tile mahjong in one page'],
    };
    let lang;try{lang=localStorage.getItem('tw-mj-lang');}catch{}
    if(lang!=='zh'&&lang!=='en')lang=navigator.language.toLowerCase().startsWith('zh')?'zh':'en';
    const t=(k,v={})=>T[k][lang==='zh'?0:1].replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
    const botName=n=>lang==='zh'?n:n.replace(/^AI ([東南西北])$/,(_,w)=>'AI '+({'東':'East','南':'South','西':'West','北':'North'})[w]);
    const body=document.getElementById('board-body');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const signed=n=>`<span class="${n>0?'pos':n<0?'neg':''}">${n>0?'+':''}${n}</span>`;
    const when=x=>{const d=new Date(x);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
    let matches,failed=false;
    function renderBoard(){
      if(failed){body.innerHTML=`<div class="board-empty">${t('failed')}</div>`;return;}
      if(!matches){body.innerHTML=`<div class="board-empty">${t('loading')}</div>`;return;}
      if(!matches.length){body.innerHTML=`<div class="board-empty">${t('empty')}</div>`;return;}
      // 真人玩家依名字合計最近 10 場的輸贏
      const agg=new Map();
      for(const m of matches){
        const best=Math.max(...m.players.map(p=>p.points));
        for(const p of m.players){if(p.kind!=='human')continue;const a=agg.get(p.name)||{name:p.name,total:0,games:0,firsts:0};a.total+=p.delta;a.games++;if(p.points===best)a.firsts++;agg.set(p.name,a);}
      }
      const ranks=[...agg.values()].sort((a,b)=>b.total-a.total);
      const table=ranks.length?`<table class="rank-table"><thead><tr><th>#</th><th>${t('player')}</th><th class="num">${t('total')}</th><th class="num hide-sm">${t('games')}</th><th class="num">${t('firsts')}</th></tr></thead><tbody>${ranks.map((a,i)=>`<tr class="rank-${i+1}"><td><span class="rank-no">${i+1}</span></td><td><b>${esc(a.name)}</b></td><td class="num">${signed(a.total)}</td><td class="num hide-sm">${a.games}</td><td class="num">${a.firsts}</td></tr>`).join('')}</tbody></table>`:'';
      const list=matches.map(m=>{
        const ps=[...m.players].sort((a,b)=>b.points-a.points);
        return `<article class="match"><div class="match-meta"><b>${when(m.endedAt)}</b><span class="tag">${m.mode==='solo'?t('solo'):t('friend')}</span><span>${m.base} / ${m.perTai}</span><span>${t('hands',{n:m.hands})}</span>${m.finished?'':`<span class="tag unfinished">${t('unfinished')}</span>`}</div><div class="match-players">${ps.map((p,i)=>`<div class="mp ${i===0?'top':''}"><div class="mp-name ${p.kind==='bot'?'bot':''}">${i===0?'👑 ':''}${esc(p.kind==='bot'?botName(p.name):p.name)}</div><div class="mp-pts">${p.points}</div><div class="mp-delta">${signed(p.delta)}</div></div>`).join('')}</div></article>`;
      }).join('');
      body.innerHTML=table+`<div class="match-list">${list}</div>`;
    }
    function apply(){
      document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
      document.querySelectorAll('[data-i18n]').forEach(el=>{if(el.closest('#board-body'))return;el.textContent=t(el.dataset.i18n);});
      document.getElementById('lang-btn').textContent=t('toggle');
      renderBoard();
    }
    document.getElementById('lang-btn').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('tw-mj-lang',lang);}catch{}apply();};
    apply();
    fetch('/api/leaderboard',{cache:'no-store'}).then(r=>r.json()).then(d=>{matches=d.matches||[];renderBoard();}).catch(()=>{failed=true;renderBoard();});
  })();
  </script>
  <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body>
</html>
