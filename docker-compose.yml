# EC2 deployment (adapted from the Synology NAS deployment guide)
# Internet --443--> Caddy (stands in for the DSM Reverse Proxy: HTTPS/WSS + Let's Encrypt) --> app:5173 --> Redis
# Only Caddy exposes 80/443; the app binds only to 127.0.0.1:5173, and Redis is never exposed outside the Docker network.

services:
  app:
    build: .
    container_name: taiwan-mahjong
    restart: unless-stopped
    # AI 出牌紀錄會寫進 docker logs；限制大小避免塞滿磁碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: "5173"
      PERSISTENCE_DRIVER: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      ROOM_TTL_SECONDS: ${ROOM_TTL_SECONDS:-86400}
      # 閒置超過此秒數的牌局自動關閉並刪除（0 = 停用）
      ROOM_IDLE_SECONDS: ${ROOM_IDLE_SECONDS:-3600}
      ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN is required}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - mahjong_net

  redis:
    image: redis:7-alpine
    container_name: taiwan-mahjong-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      # Lets the healthcheck authenticate without putting the password on the command line
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - mahjong_net

  caddy:
    image: caddy:2-alpine
    container_name: taiwan-mahjong-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - mahjong_net

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  mahjong_net:
